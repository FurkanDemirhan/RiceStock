[env]
TERM = "alacritty"

[terminal.shell]
program = "fish"

[font.normal]
family = "Minecraftia"




[colors.primary]
background = "#1d2021"  # Dark hard background
foreground = "#ebdbb2"  # Gruvbox light text

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"


[keyboard]
bindings = [
  { key = "Z", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "X", mods = "Control|Shift", action = "Quit" },
  { key = "*", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" }
]

[terminal]
